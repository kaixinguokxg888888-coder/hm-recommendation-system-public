[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-recsys-pipeline"
version = "0.1.0"
description = "Reproducible H&M recommendation-system engineering project"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyarrow>=20,<25",
    "duckdb>=1.4,<2",
    "psutil>=7,<8",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "torch>=2.13,<3",
    "hnswlib>=0.8,<1",
    "lightgbm>=4.2,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
